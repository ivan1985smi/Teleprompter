workflows:
  ios-unsigned-ipa:
    name: Build Unsigned IPA
    max_build_duration: 20
    scripts:
      - name: Fix Project Paths, Assets and Swift Code
        script: |
          python3 - <<'PY'
          import json, struct, zlib
          from pathlib import Path

          # 1. Создаём каталог иконок Assets.xcassets
          base = Path("Teleprompter/Resources/Assets.xcassets")
          appicon = base / "AppIcon.appiconset"
          accent = base / "AccentColor.colorset"
          appicon.mkdir(parents=True, exist_ok=True)
          accent.mkdir(parents=True, exist_ok=True)

          (base / "Contents.json").write_text(json.dumps({"info": {"author": "xcode", "version": 1}}, indent=2))
          (accent / "Contents.json").write_text(json.dumps({
              "colors": [{"color": {"color-space": "srgb", "components": {"alpha": "1.000", "blue": "0.180", "green": "0.560", "red": "1.000"}}, "idiom": "universal"}],
              "info": {"author": "xcode", "version": 1}
          }, indent=2))
          (appicon / "Contents.json").write_text(json.dumps({
              "images": [{"filename": "AppIcon.png", "idiom": "universal", "platform": "ios", "size": "1024x1024"}],
              "info": {"author": "xcode", "version": 1}
          }, indent=2))

          icon_file = appicon / "AppIcon.png"
          if not icon_file.exists():
              w = h = 1024
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  for x in range(w):
                      raw.extend((255, 143, 46, 255) if (abs(x - 512) < 280 and abs(y - 512) < 220) else (20, 20, 24, 255))
              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack("!IIBBBBB", w, h, 8, 6, 0, 0, 0)
              icon_file.write_bytes(b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(raw), 6)) + chunk(b"IEND", b""))

          # 2. Исправляем генератор проекта Tools/generate_project.py (mainGroup + прямые пути SOURCE_ROOT для всех файлов)
          gen = Path("Tools/generate_project.py")
          t = gen.read_text(encoding="utf-8")
          t = t.replace('main_group = add("PBXGroup", "group-main", "", {', 'main_group = add("PBXGroup", "group-main", "Main", {')
          t = t.replace('"path": "Info.plist",\n    "sourceTree": "<group>",', '"name": "Info.plist",\n    "path": "Teleprompter/Info.plist",\n    "sourceTree": "SOURCE_ROOT",')
          t = t.replace('"path": "Assets.xcassets",\n    "sourceTree": "<group>",', '"name": "Assets.xcassets",\n    "path": "Teleprompter/Resources/Assets.xcassets",\n    "sourceTree": "SOURCE_ROOT",')
          t = t.replace('"path": "Teleprompter/Resources/Assets.xcassets",\n    "sourceTree": "SOURCE_ROOT",', '"name": "Assets.xcassets",\n    "path": "Teleprompter/Resources/Assets.xcassets",\n    "sourceTree": "SOURCE_ROOT",')
          t = t.replace('"path": path.name,\n        "sourceTree": "<group>",', '"name": path.name,\n        "path": f"Teleprompter/{rel.as_posix()}",\n        "sourceTree": "SOURCE_ROOT",')
          t = t.replace('"PRODUCT_BUNDLE_IDENTIFIER": "com.example.teleprompter"', '"PRODUCT_BUNDLE_IDENTIFIER": "ru.teleprompter.app"')
          t = t.replace('"SWIFT_STRICT_CONCURRENCY": "minimal"', '"SWIFT_STRICT_CONCURRENCY": "targeted"')
          gen.write_text(t, encoding="utf-8")

          # 3. Исправляем RemoteMapping.swift (volumeUp / volumeDown -> HID 0x80 / 0x81)
          rm = Path("Teleprompter/Models/RemoteMapping.swift")
          rm.write_text(
              rm.read_text(encoding="utf-8")
              .replace("Int(GCKeyCode.volumeUp.rawValue)", "0x80")
              .replace("Int(GCKeyCode.volumeDown.rawValue)", "0x81"),
              encoding="utf-8"
          )

          # 4. Исправляем PrompterScrollView.swift (UIScrollViewDelegate -> UITextViewDelegate)
          psv = Path("Teleprompter/Views/PrompterScrollView.swift")
          psv.write_text(
              psv.read_text(encoding="utf-8")
              .replace("NSObject, UIScrollViewDelegate, PrompterScrollSurface", "NSObject, UITextViewDelegate, PrompterScrollSurface"),
              encoding="utf-8"
          )

          print("All project paths and Swift files verified!")
          PY
      - name: Regenerate Xcode project
        script: python3 Tools/generate_project.py
      - name: Build unsigned IPA
        script: bash Tools/build_unsigned_ipa.sh
    artifacts:
      - Teleprompter-unsigned.ipa
